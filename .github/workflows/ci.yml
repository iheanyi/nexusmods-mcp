name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:extension
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: vortex-extension-${{ matrix.os }}-node-${{ matrix.node }}
          path: dist/nexusmods-mcp-bridge.zip
